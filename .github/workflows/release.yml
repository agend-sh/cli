name: Release

on:
  push:
    tags:
      - "v*"

env:
  GOPRIVATE: github.com/agend-sh/*
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  id-token: write # keyless cosign signing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      # Cosign v3 publishes bundles instead of the detached signatures expected
      # by the older installer action. Bootstrap from a reviewed binary digest,
      # matching the consumer installers' independent verifier trust anchor.
      - name: Install pinned release signer
        run: |
          curl -fsSL --retry 3 https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign-linux-amd64 -o "$RUNNER_TEMP/cosign"
          echo "4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71  $RUNNER_TEMP/cosign" | sha256sum --check --status
          chmod 0755 "$RUNNER_TEMP/cosign"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Nudge the self-updating tap so brew users don't wait for its next
      # scheduled poll. Best-effort: GITHUB_TOKEN can't dispatch cross-repo,
      # so failures only log — the tap's cron catches up regardless.
      - name: Poke homebrew-tap update (best-effort)
        if: ${{ !contains(github.ref_name, '-') }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run update-formula.yml -R agend-sh/homebrew-tap || echo "cross-repo dispatch unavailable; tap cron will pick it up"
